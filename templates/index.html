<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Damage Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;       /* Fresh Sky Blue */
            --primary-hover: #0284c7;
            --bg-body: #f0f4f8;       /* Very soft blue-gray background */
            --bg-card: #ffffff;
            --text-main: #334155;     /* Slate dark gray */
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;       /* Fresh Emerald Green */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Clean, elevated white card */
        .card {
            background: var(--bg-card);
            width: 100%;
            max-width: 800px;
            border-radius: 24px;
            padding: 3.5rem;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
            text-align: center;
            animation: formFadeIn 0.6s ease-out forwards;
        }

        @keyframes formFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .upload-section {
            display: flex;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        @media (max-width: 768px) {
            .upload-section {
                flex-direction: column;
            }
        }

        .upload-box {
            flex: 1;
            background: #f8fafc;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: #f0f9ff;
        }

        .upload-box.active {
            border-color: var(--success);
            background: #ecfdf5;
        }

        .upload-box input[type="file"] {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .upload-box:hover .icon {
            transform: translateY(-4px);
        }

        .box-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }

        .box-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .file-name {
            margin-top: 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--success);
            word-break: break-all;
            display: none;
        }

        .upload-box.active .box-subtitle {
            display: none;
        }

        .upload-box.active .file-name {
            display: block;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1.2rem 3rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit.loading {
            background-color: var(--text-muted);
            box-shadow: none;
            cursor: wait;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Disaster Damage Assessment</h1>
            <p class="subtitle">Upload satellite imagery to automatically detect and classify building damage.</p>
        </div>

        <form action="/" method="POST" enctype="multipart/form-data" id="mainForm">
            <div class="upload-section">
                <!-- Pre-Disaster Image -->
                <div class="upload-box" id="boxPre">
                    <span class="icon">🌍</span>
                    <div class="box-title">Before Disaster</div>
                    <div class="box-subtitle">Click to browse or drag & drop</div>
                    <div class="file-name" id="namePre"></div>
                    <input type="file" name="pre_img" id="pre_img" accept=".png,.jpg,.jpeg,.tif,.tiff" required onchange="handleFile('pre_img', 'namePre', 'boxPre')">
                </div>

                <!-- Post-Disaster Image -->
                <div class="upload-box" id="boxPost">
                    <span class="icon">📸</span>
                    <div class="box-title">After Disaster</div>
                    <div class="box-subtitle">Click to browse or drag & drop</div>
                    <div class="file-name" id="namePost"></div>
                    <input type="file" name="post_img" id="post_img" accept=".png,.jpg,.jpeg,.tif,.tiff" required onchange="handleFile('post_img', 'namePost', 'boxPost')">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Generate Intelligence Map</button>
        </form>

        <div class="footer-note">
            Powered by Siamese U-Net and EfficientNet-B3.
        </div>
    </div>

    <script>
        // Update UI when file is chosen
        function handleFile(inputId, nameId, boxId) {
            const input = document.getElementById(inputId);
            const nameDisplay = document.getElementById(nameId);
            const box = document.getElementById(boxId);
            
            if (input.files && input.files.length > 0) {
                nameDisplay.textContent = '✓ ' + input.files[0].name;
                box.classList.add('active');
            } else {
                box.classList.remove('active');
            }
        }

        // Show loading state on submit
        document.getElementById('mainForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Analyzing Images... Please wait.';
            btn.classList.add('loading');
        });
    </script>
</body>
</html>
