upstream api {
    server api:8000;
}

server {
    listen 80;
    client_max_body_size 100M;
    
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    
    location /api/ {
        proxy_pass http://api;
        proxy_read_timeout 300s;  # inference can take up to 5 minutes
    }
    
    location /outputs/ {
        alias /app/outputs/;
        add_header Content-Disposition "attachment";
    }
    
    location / {
        root /app/static;  # React build goes here
        try_files $uri /index.html;
    }
}
